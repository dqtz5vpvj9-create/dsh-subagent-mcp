name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          DSH_PACKAGE_TEST: '1'
          DSH_NATIVE_SERVICE_TEST: '1'
      - name: Install the supported DSH runtime
        run: npm install --prefix "${{ runner.temp }}/dsh-runtime" --no-audit --no-fund @deepseek-ai/dsh@0.1.5-rc.1
      - name: Validate real DSH presets and persistence
        run: node --test test/runtime.test.mjs
        env:
          DSH_RUNTIME_TEST: '1'
          DSH_CLI: '${{ runner.temp }}/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js'
          DEEPSEEK_API_KEY: unused-runtime-fixture-key
