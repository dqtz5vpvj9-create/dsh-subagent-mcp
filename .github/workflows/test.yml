name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          DSH_PACKAGE_TEST: '1'
          DSH_NATIVE_SERVICE_TEST: '1'
      - name: Validate first installation with real Codex and DSH
        run: node --test test/fresh-install.test.mjs
        env:
          DSH_FRESH_INSTALL_TEST: '1'
      - name: Verify 100 MCP reconnects and idle resource reclamation
        run: node --test test/e2e/lifecycle.test.mjs
