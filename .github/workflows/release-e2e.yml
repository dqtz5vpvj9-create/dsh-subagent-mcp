name: Real end-to-end release acceptance
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of the ephemeral trusted SSH controller
        required: true
        type: string
      publish:
        description: Publish the same package only after every installation and real user journey passes
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: real-windows-release-acceptance
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Pack once for every acceptance job and publication
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: '${{ runner.temp }}/dsh-subagent-mcp-*.tgz'
          if-no-files-found: error
  installation-journey:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - name: Follow the public installation flow with no account credentials
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          node test/e2e/install-journey.mjs --package "candidate/dsh-subagent-mcp-$version.tgz" --output installation-journey.json
      - name: Publish installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'installation-journey-${{ matrix.os }}'
          path: installation-journey.json
          if-no-files-found: error
  codex-dsh-real:
    needs: [candidate, installation-journey]
    runs-on: [self-hosted, '${{ inputs.runner_label }}']
    timeout-minutes: 60
    steps:
      - name: Mask private controller paths before checkout
        run: |
          for private_path in "$HOME" "$RUNNER_TEMP" "$RUNNER_WORKSPACE" "$(dirname "$RUNNER_WORKSPACE")"; do
            if [ -n "$private_path" ]; then
              printf '::add-mask::%s\n' "$private_path"
            fi
          done
      - uses: actions/checkout@v4
      - name: Prepare dependencies on the trusted controller
        run: |
          umask 077
          echo 'Detailed command diagnostics remain private on the trusted controller.'
          npm ci --ignore-scripts >"$RUNNER_TEMP/e2e-dependencies.log" 2>&1
      - name: Download the accepted candidate on the trusted controller
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-candidate --dir "$RUNNER_TEMP/candidate" >"$RUNNER_TEMP/e2e-download.log" 2>&1
      - name: Install the terminal acceptance driver
        run: |
          umask 077
          python3 -m venv "$RUNNER_TEMP/e2e-python" >"$RUNNER_TEMP/e2e-python.log" 2>&1
          "$RUNNER_TEMP/e2e-python/bin/python" -m pip install pexpect==4.9.0 ptyprocess==0.7.0 pyte==0.8.2 wcwidth==0.2.13 >>"$RUNNER_TEMP/e2e-python.log" 2>&1
      - name: Real Codex and DSH user journeys on configured Windows hosts
        run: |
          umask 077
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version' 2>"$RUNNER_TEMP/e2e-version.log")
          if "$RUNNER_TEMP/e2e-python/bin/python" test/e2e/windows-release.py --package "$RUNNER_TEMP/candidate/dsh-subagent-mcp-$version.tgz" --output "$RUNNER_TEMP/e2e-results" >"$RUNNER_TEMP/e2e-driver.log" 2>&1; then
            echo 'Windows end-to-end acceptance passed. Detailed reports remain private on the trusted controller.'
          else
            echo 'Windows end-to-end acceptance failed. Inspect the private report on the trusted controller.'
            exit 1
          fi
      - name: Publish the accepted package
        if: inputs.publish
        run: |
          umask 077
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version' 2>"$RUNNER_TEMP/e2e-version.log")
          if npm publish "$RUNNER_TEMP/candidate/dsh-subagent-mcp-$version.tgz" --access public >"$RUNNER_TEMP/e2e-publication.log" 2>&1; then
            echo 'The accepted package was published.'
          else
            echo 'Package publication failed. Inspect private controller diagnostics.'
            exit 1
          fi
