<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">DSH Subagent MCP</title>
  <desc id="desc">Codex delegates through MCP to a persistent DeepSeek Harness agent. An optional Web adapter streams progress to DSH Web. Minimal preset by default.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b36"/><stop offset="1" stop-color="#101222"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#72a7ff"/><stop offset="1" stop-color="#a0d6ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6bfff" stroke-opacity=".05"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#7c9cc8" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="24" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="56" y="48" width="34" height="34" rx="9" fill="#4275ed"/>
    <path d="m67 58-5 7 5 7m12-14 5 7-5 7m-4-15-4 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="71" fill="#acbddb" font-size="16" font-weight="600" letter-spacing="2">DSH SUBAGENT MCP</text>
    <text x="56" y="145" fill="#f2f6ff" font-size="46" font-weight="700">Let Codex lead.</text>
    <text x="56" y="202" fill="url(#accent)" font-size="46" font-weight="700">Put DeepSeek to work.</text>
    <text x="58" y="242" fill="#acbddb" font-size="18">Delegate a task. Keep the context. Watch it happen.</text>
    <g transform="translate(58 287)" font-size="13" font-weight="600">
      <rect width="157" height="30" rx="15" fill="#203459"/><text x="16" y="20" fill="#c5d8ff">MINIMAL BY DEFAULT</text>
      <rect x="169" width="158" height="30" rx="15" fill="#203459"/><text x="185" y="20" fill="#c5d8ff">PERSISTENT AGENTS</text>
    </g>
    <g fill="#18253e" stroke="#33496d">
      <rect x="644" y="93" width="186" height="88" rx="14"/>
      <rect x="921" y="93" width="222" height="88" rx="14" stroke="#6094f5"/>
      <rect x="921" y="253" width="222" height="88" rx="14"/>
    </g>
    <g font-size="20" font-weight="600" fill="#f2f6ff" text-anchor="middle">
      <text x="737" y="131">Codex</text><text x="1032" y="131">DeepSeek Harness</text><text x="1032" y="291">DSH Web</text>
    </g>
    <g font-size="14" fill="#acbddb" text-anchor="middle">
      <text x="737" y="155">Direct the work</text><text x="1032" y="155">Run the task</text><text x="1032" y="315">Follow live progress</text>
    </g>
    <path d="M841 137h67" stroke="#7c9cc8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="876" y="117" font-size="12" fill="#a6bde0" text-anchor="middle">MCP</text>
    <path d="M1032 190v50" stroke="#7c9cc8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1049" y="220" font-size="12" fill="#a6bde0">Web adapter</text>
    <path d="M58 382h1085" stroke="#2a3b59"/>
    <g font-size="15" fill="#acbddb">
      <text x="58" y="425">Same session, next question.</text>
      <text x="479" y="425">Interrupt and redirect.</text>
      <text x="870" y="425">Live replies in your browser.</text>
    </g>
  </g>
</svg>
